{% extends "base.html" %}
{% block titulo %}Adicionar Game{% endblock %}

{% block conteudo %}
<h1 class="titulo-secao">➕ Adicionar Game</h1>

<form class="form-game" method="POST" action="{{ url_for('adicionar_game') }}">
    <label for="nome">Nome do game</label>
    <input type="text" id="nome" name="nome" required>

    <label for="genero">Gênero</label>
    <input type="text" id="genero" name="genero" required>

    <label for="plataforma">Plataforma</label>
    <input type="text" id="plataforma" name="plataforma" required>

    <button type="submit">Salvar</button>
</form>
{% endblock %}
